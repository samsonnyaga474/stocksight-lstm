name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q src dashboard tests config app.py

      - name: Run tests
        run: python -m pytest tests/ -q
